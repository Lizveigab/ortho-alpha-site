name: Import official Ortho Alpha branding and rooms
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-ortho-visuals.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  official-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and preserve official vector logo and clinic photos
        run: |
          python - <<'PY'
          import os, urllib.request
          os.makedirs('assets/clinic',exist_ok=True)
          base='https://www.orthoalpha.com.br/assets/'
          def get(url):
              r=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(r,timeout=50) as h:return h.read()
          logo=get(base+'logo-ortho-alpha-white.svg')
          assert b'<svg' in logo and b'#FAFBFB' in logo
          open('assets/logo-ortho-alpha-white.svg','wb').write(logo)
          open('assets/logo-ortho-alpha-dark.svg','wb').write(logo.replace(b'#FAFBFB',b'#0F172A'))
          for name in ['IMG_1512','IMG_1513','IMG_1516','IMG_1517','IMG_1528']:
              try:
                  photo=get(base+'consultorio/'+name+'.webp')
                  if len(photo)<12000: raise Exception('too small')
                  open('assets/clinic/'+name+'.webp','wb').write(photo)
                  print('Image',name,len(photo))
              except Exception as e: print('Skipped unavailable optional image',name,str(e))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build React preview
        run: |
          cd react-app
          npm install --no-audit --no-fund
          npm run build
      - name: Publish official assets and React
        run: |
          mkdir -p react
          find react -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -R react-app/dist/. react/
          cp -R assets/. react/assets/
          touch react/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo-ortho-alpha-*.svg assets/clinic react
          if ! git diff --cached --quiet; then
            git commit -m "Preserve official Ortho Alpha branding and clinic assets [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
