name: Ortho Alpha React Preview
on:
  push:
    branches: [main]
    paths:
      - 'react-app/**'
      - '.github/workflows/ortho-react-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and compile React
        run: |
          cd react-app
          npm install --no-audit --no-fund
          npm run build
      - name: Publish React under /react without replacing root site
        run: |
          mkdir -p react
          find react -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -R react-app/dist/. react/
          cp -R assets/. react/assets/
          touch react/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react
          if ! git diff --cached --quiet; then
            git commit -m "Build React preview under react/ [skip ci]"
            git push
          fi
